<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fırtına SMP - Minecraft Web</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #111;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; justify-content: center; align-items: center; color: white;
        }
        .container { text-align: center; }
        h1 { font-size: 28px; margin-bottom: 20px; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .play-btn {
            display: inline-block; padding: 15px 40px; font-size: 20px; font-weight: bold;
            color: white; background-color: #55a630; border: none; border-radius: 8px;
            cursor: pointer; text-decoration: none; box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            transition: background 0.2s;
        }
        .play-btn:hover { background-color: #2b9348; }
        p { color: #aaa; margin-top: 15px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Fırtına SMP Web Dünyası ⚡</h1>
        <!-- Güvenlik engelini aşmak için oyunu yeni sekmede tam ekran açan güvenli buton -->
        <a href="https://eaglercraft.com" class="play-btn">Minecraft'ı Başlat</a>
        <p>Her cihazda (Mobil/PC) çalışır. Tıkladıktan sonra oyun saniyeler içinde açılacaktır.</p>
    </div>
</body>
</html>
